# Fail loudly (GitHub emails the owner) if the daily trader has not published for 3+ days.
# Catches a stopped scheduled task, a failing build, or a blocked push, any of which would
# otherwise leave the public site quietly stale.
name: Freshness check

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check last trader run
        run: |
          last=$(jq -r '.state.lastRunAt // empty' dist/api/trader.json)
          if [ -z "$last" ]; then echo "::error::dist/api/trader.json has no state.lastRunAt"; exit 1; fi
          age_days=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          echo "Last trader run: $last ($age_days days ago)"
          if [ "$age_days" -ge 3 ]; then
            echo "::error::The daily trader has not published for $age_days days (last run $last)."
            exit 1
          fi
      - name: Check the Conflict Monitor feed
        # The WW3 tilts read the Conflict Monitor's data folder. If that folder cannot be read, every
        # tilt is 0 and nothing on the site says so; dist/api/refresh.json records whether it was read.
        run: |
          avail=$(jq -r '.ww3Status.available // empty' dist/api/refresh.json)
          src=$(jq -r '.ww3Status.source // empty' dist/api/refresh.json)
          reason=$(jq -r '.ww3Status.reason // empty' dist/api/refresh.json)
          echo "Conflict Monitor feed: available=${avail:-missing} source=${src:-missing}${reason:+ reason=$reason}"
          if [ "$avail" != "true" ]; then
            echo "::error::The trader could not read the Conflict Monitor data (available=${avail:-missing}${reason:+: $reason}), so its WW3 tilts are 0."
            exit 1
          fi
